name: colab-test
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install colab cli
        run: pip install google-colab-cli
      - name: write ADC
        run: |
          mkdir -p ~/.config/gcloud
          echo '${{ secrets.GOOGLE_ADC }}' > ~/.config/gcloud/application_default_credentials.json
      - name: smoke test
        run: |
          set +e
          colab --auth adc new -s ctest --gpu T4
          echo "=== ls ==="
          colab --auth adc ls -s ctest 2>&1 | head -5
          echo "=== exec ==="
          printf 'import torch\nprint("torch:", torch.__version__)\nprint("cuda:", torch.cuda.is_available())\nprint("gpu:", torch.cuda.get_device_name(0) if torch.cuda.is_available() else "NONE")\n' > smoke.py
          colab --auth adc exec -s ctest -f smoke.py --timeout 300 2>&1 | tail -15
          echo "=== stop ==="
          colab --auth adc stop -s ctest
          exit 0
