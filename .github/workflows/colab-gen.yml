name: colab-gen
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Video prompt"
        required: false
        default: "a cute orange cat walking through a sunny meadow, cinematic lighting, high quality, 4k detail"
      mode:
        description: "probe (diagnose load) or full (generate video)"
        required: false
        default: "full"

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install colab cli
        run: pip install google-colab-cli "jupyter-kernel-client==0.15.0"
      - name: write ADC
        env:
          GOOGLE_ADC_B64: ${{ secrets.GOOGLE_ADC_B64 }}
        run: |
          mkdir -p ~/.config/gcloud
          echo "$GOOGLE_ADC_B64" | base64 -d > ~/.config/gcloud/application_default_credentials.json
      - name: build gen script
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          python - <<'PY'
          import json, os
          mode = os.environ.get("MODE", "full")
          prompt = os.environ.get("PROMPT", "a cute orange cat walking through a sunny meadow")
          probe = '''import time, torch, os, subprocess
          t0 = time.time()
          BASE = "https://huggingface.co/Wan-AI/Wan2.1-T2V-1.3B-Diffusers/resolve/main/"
          FILES = [
              "model_index.json", "scheduler/scheduler_config.json",
              "text_encoder/config.json", "text_encoder/model.safetensors.index.json",
              "text_encoder/model-00001-of-00005.safetensors", "text_encoder/model-00002-of-00005.safetensors",
              "text_encoder/model-00003-of-00005.safetensors", "text_encoder/model-00004-of-00005.safetensors",
              "text_encoder/model-00005-of-00005.safetensors",
              "tokenizer/special_tokens_map.json", "tokenizer/spiece.model", "tokenizer/tokenizer.json", "tokenizer/tokenizer_config.json",
              "transformer/config.json", "transformer/diffusion_pytorch_model.safetensors.index.json",
              "transformer/diffusion_pytorch_model-00001-of-00002.safetensors", "transformer/diffusion_pytorch_model-00002-of-00002.safetensors",
              "vae/config.json", "vae/diffusion_pytorch_model.safetensors",
          ]
          print("checking files...", flush=True)
          need = []
          for f in FILES:
              if not os.path.exists("/content/wan/" + f) or os.path.getsize("/content/wan/" + f) == 0:
                  need.append(f)
          print(f"missing {len(need)} files, downloading...", flush=True)
          for f in need:
              p = "/content/wan/" + f
              os.makedirs(os.path.dirname(p), exist_ok=True)
              for a in range(3):
                  r = subprocess.run(["curl", "-sL", "--retry", "5", "--retry-delay", "2", "--connect-timeout", "30", "-o", p, BASE + f], timeout=600)
                  if r.returncode == 0 and os.path.getsize(p) > 0:
                      print(f"DL {f} {os.path.getsize(p)//1048576}MB", flush=True)
                      break
          print("downloads done", flush=True)
          from transformers import UMT5EncoderModel, T5TokenizerFast
          tok = T5TokenizerFast.from_pretrained("/content/wan/tokenizer")
          te = UMT5EncoderModel.from_pretrained("/content/wan/text_encoder", torch_dtype=torch.float16, low_cpu_mem_usage=True)
          print("te loaded", flush=True)
          r = subprocess.run(["free", "-m"], capture_output=True, text=True)
          print("MEM after te:", r.stdout.strip().splitlines()[1], flush=True)
          from diffusers import WanTransformer3DModel
          print("default_dtype:", torch.get_default_dtype(), flush=True)
          torch.set_default_dtype(torch.float16)
          t0 = time.time()
          try:
              tr = WanTransformer3DModel.from_config("/content/wan/transformer/config.json")
              torch.set_default_dtype(torch.float32)
              print(f"from_config ok {time.time()-t0:.1f}s p0={next(tr.parameters()).dtype}", flush=True)
              t0 = time.time()
              tr = tr.to("cuda")
              print(f"to_cuda ok {time.time()-t0:.1f}s gpu={torch.cuda.memory_allocated()/1e9:.1f}GB", flush=True)
              te = te.to("cuda")
              from safetensors import safe_open
              t0 = time.time()
              state = {}
              with safe_open("/content/wan/transformer/diffusion_pytorch_model-00001-of-00002.safetensors", framework="pt", device="cuda") as f:
                  for k in f.keys():
                      state[k] = f.get_tensor(k)
              print(f"read shard1 {time.time()-t0:.1f}s", flush=True)
              t0 = time.time()
              tr.load_state_dict(state, strict=True)
              print(f"load_state_dict ok {time.time()-t0:.1f}s", flush=True)
          except Exception as e:
              print("FAIL:", repr(e)[:300], flush=True)
          '''
          gen = r'''import torch, os, time, sys, gc, subprocess, json
          os.environ["HF_HUB_DISABLE_XET"] = "1"
          os.environ["HF_HUB_DISABLE_TELEMETRY"] = "1"
          os.environ["PYTORCH_CUDA_ALLOC_CONF"] = "expandable_segments:True"
          def log(m):
              print(m, flush=True)
          t0 = time.time()
          log(f"[gen] t={time.time()-t0:.0f}s start, torch={torch.__version__}, cuda={torch.cuda.is_available()}")
          BASE = "https://huggingface.co/Wan-AI/Wan2.1-T2V-1.3B-Diffusers/resolve/main/"
          FILES = [
              "model_index.json", "scheduler/scheduler_config.json",
              "text_encoder/config.json", "text_encoder/model.safetensors.index.json",
              "text_encoder/model-00001-of-00005.safetensors", "text_encoder/model-00002-of-00005.safetensors",
              "text_encoder/model-00003-of-00005.safetensors", "text_encoder/model-00004-of-00005.safetensors",
              "text_encoder/model-00005-of-00005.safetensors",
              "tokenizer/special_tokens_map.json", "tokenizer/spiece.model", "tokenizer/tokenizer.json", "tokenizer/tokenizer_config.json",
              "transformer/config.json", "transformer/diffusion_pytorch_model.safetensors.index.json",
              "transformer/diffusion_pytorch_model-00001-of-00002.safetensors", "transformer/diffusion_pytorch_model-00002-of-00002.safetensors",
              "vae/config.json", "vae/diffusion_pytorch_model.safetensors",
          ]
          def dl(f):
              p = "/content/wan/" + f
              os.makedirs(os.path.dirname(p), exist_ok=True)
              for a in range(3):
                  r = subprocess.run(["curl", "-sL", "--retry", "5", "--retry-delay", "2", "--connect-timeout", "30", "-o", p, BASE + f], timeout=600)
                  if r.returncode == 0 and os.path.getsize(p) > 0:
                      log(f"[gen] t={time.time()-t0:.0f}s DL {f} {os.path.getsize(p)//1048576}MB")
                      return
                  log(f"[gen] t={time.time()-t0:.0f}s DL RETRY {f}")
          log(f"[gen] t={time.time()-t0:.0f}s downloading {len(FILES)} files...")
          for f in FILES:
              dl(f)
          log(f"[gen] t={time.time()-t0:.0f}s all files downloaded")
          import torch
          from diffusers import WanTransformer3DModel, AutoencoderKLWan, UniPCMultistepScheduler
          from transformers import UMT5EncoderModel, T5TokenizerFast
          from diffusers.utils import export_to_video
          from safetensors.torch import load_model
          log(f"[gen] t={time.time()-t0:.0f}s imports done")
          tok = T5TokenizerFast.from_pretrained("/content/wan/tokenizer")
          log(f"[gen] t={time.time()-t0:.0f}s tokenizer loaded")
          log(f"[gen] t={time.time()-t0:.0f}s loading text_encoder on cpu...")
          te = UMT5EncoderModel.from_pretrained("/content/wan/text_encoder", torch_dtype=torch.float16, low_cpu_mem_usage=True)
          log(f"[gen] t={time.time()-t0:.0f}s text_encoder loaded, moving to cuda...")
          te = te.to("cuda")
          del te
          gc.collect()
          torch.cuda.empty_cache()
          log(f"[gen] t={time.time()-t0:.0f}s text_encoder freed from gpu, gpu={torch.cuda.memory_allocated()/1e9:.1f}GB")
          log(f"[gen] t={time.time()-t0:.0f}s loading text_encoder again (quick, from_pretrained caches)...")
          te = UMT5EncoderModel.from_pretrained("/content/wan/text_encoder", torch_dtype=torch.float16, low_cpu_mem_usage=True)
          log(f"[gen] t={time.time()-t0:.0f}s text_encoder reloaded on cpu")
          r = subprocess.run(["free", "-m"], capture_output=True, text=True)
          log(f"[gen] mem: {r.stdout.strip().splitlines()[1]}")
          log(f"[gen] t={time.time()-t0:.0f}s loading transformer on cpu...")
          torch.set_default_dtype(torch.float16)
          tr = WanTransformer3DModel.from_config("/content/wan/transformer/config.json")
          load_model(tr, "/content/wan/transformer/diffusion_pytorch_model-00001-of-00002.safetensors", strict=False)
          load_model(tr, "/content/wan/transformer/diffusion_pytorch_model-00002-of-00002.safetensors", strict=False)
          log(f"[gen] t={time.time()-t0:.0f}s transformer loaded on cpu")
          r = subprocess.run(["free", "-m"], capture_output=True, text=True)
          log(f"[gen] mem: {r.stdout.strip().splitlines()[1]}")
          log(f"[gen] t={time.time()-t0:.0f}s loading vae on cpu...")
          vae = AutoencoderKLWan.from_config("/content/wan/vae/config.json")
          load_model(vae, "/content/wan/vae/diffusion_pytorch_model.safetensors")
          log(f"[gen] t={time.time()-t0:.0f}s vae loaded on cpu")
          sch = UniPCMultistepScheduler.from_pretrained("/content/wan/scheduler")
          log(f"[gen] t={time.time()-t0:.0f}s building pipeline...")
          pipe = None
          import diffusers
          pipe = diffusers.WanPipeline(text_encoder=te, tokenizer=tok, transformer=tr, vae=vae, scheduler=sch)
          log(f"[gen] t={time.time()-t0:.0f}s pipeline built")
          prompt_str = %s
          neg = "bright, low quality, watermark, text, jpeg artifacts"
          log(f"[gen] t={time.time()-t0:.0f}s encoding prompt...")
          prompt_embeds, negative_prompt_embeds = pipe.encode_prompt(prompt=prompt_str, negative_prompt=neg, device="cuda", dtype=torch.float16)
          log(f"[gen] t={time.time()-t0:.0f}s prompt encoded, freeing text_encoder...")
          te_cpu = te
          pipe.text_encoder = None
          del te_cpu
          gc.collect()
          torch.cuda.empty_cache()
          log(f"[gen] t={time.time()-t0:.0f}s text_encoder freed, gpu={torch.cuda.memory_allocated()/1e9:.1f}GB")
          log(f"[gen] t={time.time()-t0:.0f}s moving transformer to cuda...")
          tr = tr.to("cuda")
          gc.collect()
          log(f"[gen] t={time.time()-t0:.0f}s transformer on cuda, gpu={torch.cuda.memory_allocated()/1e9:.1f}GB")
          log(f"[gen] t={time.time()-t0:.0f}s generating latents...")
          latents = torch.randn(1, 16, 13, 48, 84, dtype=torch.float16, device="cuda")
          from diffusers.utils import randn_tensor
          shape = (1, 16, 13, 48, 84)
          latents = randn_tensor(shape, dtype=torch.float16, device="cuda", generator=torch.Generator(device="cuda").manual_seed(42))
          timesteps = torch.linspace(1000, 0, 21, device="cuda")
          for i, t in enumerate(timesteps[:-1]):
              t_tensor = torch.tensor([t], device="cuda", dtype=torch.float16)
              noise_pred = tr(hidden_states=latents, timestep=t_tensor, encoder_hidden_states=prompt_embeds).sample
              alphas_cumprod = sch.betas
              alpha = alphas_cumprod[int(t)]
              beta = 1 - alpha
              latents = latents - beta * noise_pred
              if i % 5 == 0:
                  log(f"[gen] t={time.time()-t0:.0f}s step {i+1}/20, gpu={torch.cuda.memory_allocated()/1e9:.1f}GB")
          log(f"[gen] t={time.time()-t0:.0f}s denoising done, freeing transformer...")
          pipe.transformer = None
          del tr
          gc.collect()
          torch.cuda.empty_cache()
          log(f"[gen] t={time.time()-t0:.0f}s transformer freed, moving vae to cuda...")
          vae = vae.to("cuda")
          gc.collect()
          log(f"[gen] t={time.time()-t0:.0f}s vae on cuda, gpu={torch.cuda.memory_allocated()/1e9:.1f}GB")
          log(f"[gen] t={time.time()-t0:.0f}s decoding...")
          with torch.no_grad():
              decoded = vae.decode(latents / vae.config.scaling_factor).sample
          log(f"[gen] t={time.time()-t0:.0f}s decode done")
          images = (decoded / 2 + 0.5).clamp(0, 1).permute(0, 2, 3, 4, 1).float().cpu().numpy()
          from diffusers.utils import export_to_video
          export_to_video(images, "/content/out.mp4", fps=16)
          log(f"[gen] DONE t={time.time()-t0:.0f}s size={os.path.getsize('/content/out.mp4')}")
          print("OUTPUT_FILE=/content/out.mp4", flush=True)
          ''' % json.dumps(prompt)
          import textwrap
          if mode == "probe":
              open("run.py", "w").write(textwrap.dedent(probe))
              print("run.py (probe) written")
          else:
              open("run.py", "w").write(textwrap.dedent(gen))
              print("run.py (gen) written")
          PY
      - name: ensure T4 session
        run: |
          if colab --auth adc ls -s gen 2>&1 | grep -q READY; then
            echo "session already alive, reusing"
          else
            for i in 1 2 3 4; do
              echo "=== new attempt $i ==="
              if colab --auth adc new -s gen --gpu T4; then
                exit 0
              fi
              sleep 120
            done
            exit 1
          fi
      - name: probe HF speed
        run: |
          printf 'import urllib.request, time, ssl\nctx=ssl.create_default_context()\nu="https://huggingface.co/Wan-AI/Wan2.1-T2V-1.3B-Diffusers/resolve/main/transformer/diffusion_pytorch_model-00001-of-00002.safetensors"\nfor mb in [1, 10, 50]:\n    req=urllib.request.Request(u, headers={"Range": f"bytes=0-{mb*1048576-1}"})\n    t=time.time()\n    try:\n        d=urllib.request.urlopen(req, timeout=60, context=ctx).read()\n        sp=(time.time()-t)\n        print(f"dl{mb}MB", len(d), f"{sp:.1f}s", f"{len(d)/sp/1048576:.2f}MB/s")\n    except Exception as e:\n        print(f"dl{mb}MB FAIL", repr(e)[:200])\n' > probe.py
          colab --auth adc exec -s gen -f probe.py --timeout 180 2>&1 | tail -12
      - name: run generation
        env:
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -o pipefail
          if [ "$MODE" = "probe" ]; then
            colab --auth adc exec -s gen -f run.py --timeout 900 2>&1 | tail -30
          else
            colab --auth adc exec -s gen -f run.py --timeout 3600 2>&1 | tail -80
          fi
      - name: download result
        if: ${{ github.event.inputs.mode != 'probe' }}
        run: |
          colab --auth adc download -s gen /content/out.mp4 out.mp4
          ls -la out.mp4
      - name: upload artifact
        if: ${{ github.event.inputs.mode != 'probe' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: out.mp4
      - name: teardown session
        if: always() && ${{ github.event.inputs.mode == 'full' }}
        run: colab --auth adc stop -s gen || true
