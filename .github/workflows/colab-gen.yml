name: colab-gen
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Video prompt"
        required: false
        default: "a cute orange cat walking through a sunny meadow, cinematic lighting, high quality, 4k detail"

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install colab cli
        run: pip install google-colab-cli "jupyter-kernel-client==0.15.0"
      - name: write ADC
        env:
          GOOGLE_ADC_B64: ${{ secrets.GOOGLE_ADC_B64 }}
        run: |
          mkdir -p ~/.config/gcloud
          echo "$GOOGLE_ADC_B64" | base64 -d > ~/.config/gcloud/application_default_credentials.json
      - name: build gen script
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
        run: |
          python - <<'PY'
          import json, os
          prompt = os.environ.get("PROMPT", "a cute orange cat walking through a sunny meadow")
          gen = '''import torch, os, time, sys
          os.environ["HF_HUB_DISABLE_XET"] = "1"
          os.environ["HF_HUB_DISABLE_TELEMETRY"] = "1"
          def log(m):
              print(m, flush=True)
          t0 = time.time()
          log(f"[gen] t={time.time()-t0:.0f}s start, torch={torch.__version__}, cuda={torch.cuda.is_available()}")
          import urllib.request, ssl, concurrent.futures
          ctx = ssl.create_default_context()
          BASE = "https://huggingface.co/Wan-AI/Wan2.1-T2V-1.3B-Diffusers/resolve/main/"
          FILES = [
              "model_index.json", "scheduler/scheduler_config.json",
              "text_encoder/config.json", "text_encoder/model.safetensors.index.json",
              "text_encoder/model-00001-of-00005.safetensors", "text_encoder/model-00002-of-00005.safetensors",
              "text_encoder/model-00003-of-00005.safetensors", "text_encoder/model-00004-of-00005.safetensors",
              "text_encoder/model-00005-of-00005.safetensors",
              "tokenizer/special_tokens_map.json", "tokenizer/spiece.model", "tokenizer/tokenizer.json", "tokenizer/tokenizer_config.json",
              "transformer/config.json", "transformer/diffusion_pytorch_model.safetensors.index.json",
              "transformer/diffusion_pytorch_model-00001-of-00002.safetensors", "transformer/diffusion_pytorch_model-00002-of-00002.safetensors",
              "vae/config.json", "vae/diffusion_pytorch_model.safetensors",
          ]
          def dl(f):
              p = "/content/wan/" + f
              os.makedirs(os.path.dirname(p), exist_ok=True)
              for a in range(3):
                  r = subprocess.run(["curl", "-sL", "--retry", "5", "--retry-delay", "2", "--connect-timeout", "30", "-o", p, BASE + f], timeout=600)
                  if r.returncode == 0 and os.path.getsize(p) > 0:
                      log(f"[gen] t={time.time()-t0:.0f}s DL {f} {os.path.getsize(p)//1048576}MB")
                      return
                  log(f"[gen] t={time.time()-t0:.0f}s DL RETRY {f}")
          import subprocess
          log(f"[gen] t={time.time()-t0:.0f}s downloading {len(FILES)} files (curl serial)...")
          for f in FILES:
              dl(f)
          log(f"[gen] t={time.time()-t0:.0f}s all files downloaded")
          from diffusers import WanTransformer3DModel, AutoencoderKLWan, UniPCMultistepScheduler, WanPipeline
          from transformers import UMT5EncoderModel, T5TokenizerFast
          from diffusers.utils import export_to_video
          from safetensors import safe_open
          log(f"[gen] t={time.time()-t0:.0f}s diffusers imported")
          tok = T5TokenizerFast.from_pretrained("/content/wan/tokenizer")
          log(f"[gen] t={time.time()-t0:.0f}s tokenizer loaded")
          te = UMT5EncoderModel.from_pretrained("/content/wan/text_encoder", torch_dtype=torch.float16, low_cpu_mem_usage=True)
          log(f"[gen] t={time.time()-t0:.0f}s text_encoder loaded")
          def load_sf(files, model, tag):
              model.to("cuda")
              state = {}
              for fp in files:
                  with safe_open(fp, framework="pt", device="cuda") as f:
                      for k in f.keys():
                          state[k] = f.get_tensor(k)
                  log(f"[gen] t={time.time()-t0:.0f}s safetensors read {fp.split('/')[-1]}")
              model.load_state_dict(state, strict=True)
              log(f"[gen] t={time.time()-t0:.0f}s {tag} loaded")
          tr = WanTransformer3DModel.from_config("/content/wan/transformer/config.json")
          load_sf(["/content/wan/transformer/diffusion_pytorch_model-00001-of-00002.safetensors",
                   "/content/wan/transformer/diffusion_pytorch_model-00002-of-00002.safetensors"], tr, "transformer")
          vae = AutoencoderKLWan.from_config("/content/wan/vae/config.json")
          load_sf(["/content/wan/vae/diffusion_pytorch_model.safetensors"], vae, "vae")
          sch = UniPCMultistepScheduler.from_pretrained("/content/wan/scheduler")
          log(f"[gen] t={time.time()-t0:.0f}s scheduler loaded")
          te.to("cuda")
          pipe = WanPipeline(text_encoder=te, tokenizer=tok, transformer=tr, vae=vae, scheduler=sch)
          log(f"[gen] t={time.time()-t0:.0f}s model loaded")
          pipe.to("cuda")
          log(f"[gen] t={time.time()-t0:.0f}s moved to cuda")
          prompt = %s
          neg = "bright, low quality, watermark, text, jpeg artifacts"
          log(f"[gen] t={time.time()-t0:.0f}s generating...")
          out = pipe(prompt=prompt, negative_prompt=neg, num_frames=49, height=384, width=672, num_inference_steps=20, guidance_scale=5.0).frames[0]
          export_to_video(out, "/content/out.mp4", fps=16)
          log(f"[gen] DONE t={time.time()-t0:.0f}s size={os.path.getsize('/content/out.mp4')}")
          print("OUTPUT_FILE=/content/out.mp4", flush=True)
          ''' % json.dumps(prompt)
          open("gen.py", "w").write(gen)
          print("gen.py written")
          PY
      - name: create T4 session
        run: colab --auth adc new -s gen --gpu T4
      - name: probe HF speed
        run: |
          printf 'import urllib.request, time, ssl\nctx=ssl.create_default_context()\nu="https://huggingface.co/Wan-AI/Wan2.1-T2V-1.3B-Diffusers/resolve/main/transformer/diffusion_pytorch_model-00001-of-00002.safetensors"\nfor mb in [1, 10, 50]:\n    req=urllib.request.Request(u, headers={"Range": f"bytes=0-{mb*1048576-1}"})\n    t=time.time()\n    try:\n        d=urllib.request.urlopen(req, timeout=60, context=ctx).read()\n        sp=(time.time()-t)\n        print(f"dl{mb}MB", len(d), f"{sp:.1f}s", f"{len(d)/sp/1048576:.2f}MB/s")\n    except Exception as e:\n        print(f"dl{mb}MB FAIL", repr(e)[:200])\n' > probe.py
          colab --auth adc exec -s gen -f probe.py --timeout 180 2>&1 | tail -12
      - name: run generation
        run: |
          set -o pipefail
          colab --auth adc exec -s gen -f gen.py --timeout 1500 2>&1 | tail -60
      - name: download result
        run: |
          colab --auth adc download -s gen /content/out.mp4 out.mp4
          ls -la out.mp4
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: out.mp4
      - name: teardown session
        if: always()
        run: colab --auth adc stop -s gen || true
